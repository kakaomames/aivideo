name: Generate Frames
on:
  repository_dispatch:
    types: [generate_frame_trigger]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch diffusers transformers pillow accelerate requests

      - name: Run Generator
        env:
          PROMPT: ${{ github.event.client_payload.prompt }}
          CHARACTER_PROMPT: ${{ github.event.client_payload.character_prompt }}
          SECONDS: ${{ github.event.client_payload.seconds }}
          IMAGE_URL: ${{ github.event.client_payload.image_url }}
        run: |
          python scripts/generate_frames.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: animation-frames
          path: output_frames/
